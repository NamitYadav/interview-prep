<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal practice tool for a staff frontend interview loop: HR screen, hiring manager, live coding, frontend system design, case study, debrief, and head of engineering rounds." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
    <title>Interview Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      // Set before first paint so the page never flashes the default theme.
      // Key duplicated from src/hooks/useTheme.ts — keep the two in sync.
      try {
        var t = localStorage.getItem('interview-prep:theme');
        if (t === 'gruvbox') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: keep the default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
