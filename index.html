<!doctype html>
<html lang="en" data-theme="gruvbox">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Personal tool, not a public page: keep it out of search results. -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="Personal practice tool for frontend and full-stack interview loops: HR screen, hiring manager, live coding, algorithms, backend and data, frontend system design, case study, debrief, head of engineering, tech lead and architecture deep-dive rounds, across senior, staff, lead and architect scopes." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="theme-color" content="#1d2021" />
    <title>Interview Prep</title>
    <script>
      // Set before first paint so the page never flashes the default theme.
      // Key duplicated from src/hooks/useTheme.ts — keep the two in sync. Nothing
      // stored means System: the Gruvbox pair, picked by the OS setting.
      var t = null;
      try { t = localStorage.getItem('interview-prep:theme'); } catch (e) { /* storage unavailable */ }
      if (t !== 'dark' && t !== 'gruvbox' && t !== 'gruvbox-light' && t !== 'light') {
        t = matchMedia('(prefers-color-scheme: light)').matches ? 'gruvbox-light' : 'gruvbox';
      }
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
