<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal practice tool for frontend interview loops: HR screen, hiring manager, live coding, frontend system design, case study, debrief, head of engineering, tech lead and architecture deep-dive rounds, across senior, staff, lead and architect scopes." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="theme-color" content="#09090b" />
    <title>Interview Prep</title>
    <script>
      // Set before first paint so the page never flashes the default theme.
      // Key duplicated from src/hooks/useTheme.ts — keep the two in sync.
      try {
        var t = localStorage.getItem('interview-prep:theme');
        if (t === 'gruvbox' || t === 'gruvbox-light' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: keep the default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
